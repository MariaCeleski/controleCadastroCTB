name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish apps/backend/src/AccessControl.Api/AccessControl.Api.csproj --configuration Release --output publish/api
      - uses: actions/upload-artifact@v7
        with:
          name: api-${{ github.ref_name }}
          path: publish/api

  desktop:
    # The desktop signing secrets must be configured before enabling distribution.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.ref_name }}
          path: apps/frontend/dist

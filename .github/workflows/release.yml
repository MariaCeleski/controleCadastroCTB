name: Release artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish apps/backend/src/AccessControl.Api/AccessControl.Api.csproj --configuration Release --output publish/api
      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ github.ref_name }}
          path: publish/api

  desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: desktop-macos
          - os: windows-latest
            artifact: desktop-windows
    # Signing is enabled only after the required certificate secrets are configured.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run tauri:build --workspace=@controle-acessos/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: apps/frontend/src-tauri/target/release/bundle

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: access_control
      POSTGRES_USER: access_control
      POSTGRES_PASSWORD: local_development_only
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U access_control -d access_control']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
